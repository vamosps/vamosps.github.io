<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e4e4e7"/>
      <stop offset="70%" stop-color="#a1a1aa"/>
      <stop offset="100%" stop-color="#d4d4d8"/>
    </linearGradient>
    <linearGradient id="silverBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#ffffff" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Deep Black Background with Smooth Rounded Corners -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)"/>
  <rect x="10" y="10" width="492" height="492" rx="104" ry="104" fill="none" stroke="url(#silverBorder)" stroke-width="5" opacity="0.6"/>

  <!-- Sparkling Diamond -->
  <g transform="translate(256, 120)" filter="url(#glow)">
    <polygon points="0,-32 26,-8 0,20 -26,-8" fill="url(#silverGrad)"/>
    <polygon points="0,-32 11,-8 0,20" fill="#ffffff" opacity="0.9"/>
    <polygon points="0,-32 -11,-8 0,20" fill="#a1a1aa" opacity="0.8"/>
  </g>

  <!-- Crown Arch -->
  <path d="M200 160 Q256 185 312 160 Q290 190 256 195 Q222 190 200 160 Z" fill="url(#silverGrad)"/>
  <circle cx="200" cy="160" r="5" fill="#ffffff"/>
  <circle cx="312" cy="160" r="5" fill="#ffffff"/>

  <!-- Sleek Crown Crescent Arch -->
  <path d="M120 260 Q256 185 392 260 Q256 200 120 260 Z" fill="url(#silverGrad)" opacity="0.9"/>

  <!-- Calligraphic 'Vamos' Text -->
  <text x="256" y="340" font-family="'Times New Roman', 'Playfair Display', 'Cinzel', 'Georgia', serif" font-size="96" font-weight="900" font-style="italic" fill="url(#silverGrad)" text-anchor="middle" filter="url(#glow)">Vamos</text>

  <!-- JEWELRY Subtext with divider lines -->
  <line x1="80" y1="385" x2="180" y2="385" stroke="url(#silverBorder)" stroke-width="2"/>
  <text x="256" y="392" font-family="'Cairo', 'Segoe UI', sans-serif" font-size="22" font-weight="700" letter-spacing="12" fill="#d4d4d8" text-anchor="middle">JEWELRY</text>
  <line x1="332" y1="385" x2="432" y2="385" stroke="url(#silverBorder)" stroke-width="2"/>

  <!-- Bottom Star Accent -->
  <polygon points="256,415 259,425 269,428 259,431 256,441 253,431 243,428 253,425" fill="#ffffff" filter="url(#glow)"/>
</svg>