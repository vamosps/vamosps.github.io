<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Luxury Background with subtle golden border -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="url(#goldGrad)" stroke-width="6" opacity="0.6"/>

  <!-- Sparkling Diamond Crest -->
  <g transform="translate(256, 135) scale(1.3)" filter="url(#glow)">
    <polygon points="0,-35 28,-8 0,22 -28,-8" fill="url(#goldGrad)"/>
    <polygon points="0,-35 12,-8 0,22" fill="#fef08a" opacity="0.85"/>
    <polygon points="0,-35 -12,-8 0,22" fill="#d97706" opacity="0.85"/>
    <polygon points="0,-35 28,-8 12,-8" fill="#ffffff" opacity="0.95"/>
    <polygon points="0,-35 -28,-8 -12,-8" fill="#f59e0b" opacity="0.95"/>
  </g>

  <!-- Royal V Monogram -->
  <path d="M140 205 L220 395 Q256 425 292 395 L372 205 Q382 185 355 185 Q340 185 332 203 L268 355 Q256 375 244 355 L180 203 Q172 185 157 185 Q130 185 140 205 Z" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- Brand Subtext -->
  <text x="256" y="465" font-family="'Cairo', 'Segoe UI', sans-serif" font-size="34" font-weight="900" letter-spacing="8" fill="url(#emeraldGrad)" text-anchor="middle">VAMOS</text>
</svg>
